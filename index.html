let currentRoute = "TH-EG";

const cities = {
  "TH-EG": ["Bangkok", "Cairo"],
  "EG-TH": ["Cairo", "Bangkok"]
};

function setupRoute(route) {
  currentRoute = route;
  document.querySelectorAll(".route").forEach(b => b.classList.toggle("active", b.dataset.route === route));
  const [fromDefault,toDefault] = route === "TH-EG" ? ["Bangkok","Cairo"] : ["Cairo","Bangkok"];
  const from = document.getElementById("from"), to = document.getElementById("to");
  const opts = cities[route];
  from.innerHTML = `<option>${opts[0]}</option>`;
  to.innerHTML = `<option>${opts[1]}</option>`;
  from.value = fromDefault; to.value = toDefault;
  searchListings();
}

document.querySelectorAll(".route").forEach(b => b.addEventListener("click", () => setupRoute(b.dataset.route)));

function formatDate(d) {
  return new Date(d+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
}

const TIMEZONES = {
  "TH-EG": "Asia/Bangkok",   // ต้นทางไทย
  "EG-TH": "Africa/Cairo"    // ต้นทางอียิปต์
};

function getTodayStr(route) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: TIMEZONES[route],
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

function searchListings() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const date = document.getElementById("date").value;
  const sort = document.getElementById("sort").value;

const today = getTodayStr(currentRoute);
  let data = listings.filter(x =>
  x.route === currentRoute &&
  x.from === from &&
  x.to === to &&
  x.date > today          // วันเดินทางตรงกับวันนี้หรือผ่านไปแล้ว = ไม่แสดง
);
if (date) data = data.filter(x => x.date.startsWith(date));  

  if (sort === "date") data.sort((a,b)=>a.date.localeCompare(b.date));
  if (sort === "price") data.sort((a,b) => {
  const pa = a.pricePerKg ?? Infinity, pb = b.pricePerKg ?? Infinity;
  return pa === pb ? 0 : pa - pb;
});

  document.getElementById("summary").textContent =
    `พบ ${data.length} รายการ — ${from} → ${to}`;

  const results = document.getElementById("results");
  if (!data.length) {
    results.innerHTML = `<div class="empty">ยังไม่พบรายการที่ตรงกับการค้นหา<br><br>ลองเปลี่ยนวันที่ หรือเมือง</div>`;
    return;
  }

  results.innerHTML = data.map(x => `
  <article class="card">
    <div class="card-top">
      <div>
        <div class="title">👤 ${x.name}</div>
        <div class="meta">
        ✈️ ${x.from} → ${x.to}<br>
        📅 ${formatDate(x.date)}
      </div>
      </div>
    </div>
    <div class="price">
      ${x.pricePerKg != null ? `⚖️ ${x.pricePerKg.toLocaleString()} ${x.currency} / kg<br>` : ""}
      ${x.pricePerBag != null ? `🧳 ${typeof x.pricePerBag === "number" ? x.pricePerBag.toLocaleString() : x.pricePerBag} ${x.currency} / ใบ` : ""}    </div>
    <a class="contact" href="${x.contact}" target="_blank" rel="noopener noreferrer">ติดต่อผู้เดินทาง</a>
  </article>
`).join("");
}

function resetSearch() {
  document.getElementById("date").value = "";
  document.getElementById("sort").value = "date";
  setupRoute(currentRoute);
}

setupRoute("TH-EG");
</script>
