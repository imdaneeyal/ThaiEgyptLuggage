<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #172033;
  }
  .container { max-width: 980px; margin: auto; padding: 24px 16px 50px; }
  header {
    background: linear-gradient(135deg,#173b70,#2878a8);
    color: white; padding: 34px 20px; border-radius: 20px;
    margin-bottom: 20px;
  }
  h1 { margin: 0 0 8px; font-size: 30px; }
  header p { margin: 0; opacity: .9; }
  .search-box {
    background: white; border-radius: 18px; padding: 20px;
    box-shadow: 0 8px 30px rgba(20,40,80,.08);
  }
  .routes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .route {
    border: 2px solid #e1e6ef; background: #fff; padding: 14px;
    border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 700;
  }
  .route.active { border-color: #2878a8; background: #eef8fc; color: #17658e; }
  .fields { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; }
  label { font-size: 13px; font-weight: 700; color:#586174; display:block; margin-bottom:6px; }
  input, select {
    width:100%; padding:12px; border:1px solid #d8deea; border-radius:10px;
    font-size:15px; background:white;
  }
  .actions { display:flex; gap:10px; margin-top:14px; }
  button {
    border:0; border-radius:10px; padding:12px 18px; cursor:pointer;
    font-size:15px; font-weight:700;
  }
  .primary { background:#176b9a; color:white; flex:1; }
  .secondary { background:#eef1f6; color:#38445a; }
  .summary { margin:24px 0 12px; font-weight:800; }
  .results { display:grid; gap:12px; }
  .card {
    background:white; border-radius:16px; padding:18px;
    box-shadow:0 5px 18px rgba(20,40,80,.06);
    border:1px solid #e9edf4;
  }
  .card-top { display:flex; justify-content:space-between; gap:12px; }
  .badge { background:#eaf6ed; color:#23713c; padding:5px 9px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap; }
  .title { font-size:18px; font-weight:800; }
  .meta { color:#657084; margin-top:7px; line-height:1.7; }
  .price { font-size:18px; font-weight:800; margin-top:10px; }
  .contact { margin-top:14px; width:100%; background:#172033; color:white; }
  a.contact { display:block; text-align:center; text-decoration:none;
  padding:12px 18px; border-radius:10px; font-weight:700; }
  .empty { text-align:center; padding:35px 15px; color:#687286; background:white; border-radius:16px; }
  .notice {
    margin-top:20px; font-size:12px; line-height:1.6; color:#687286;
    background:#fff8e8; border:1px solid #f1dfaa; padding:13px; border-radius:12px;
  }
  @media(max-width:700px){
    .fields { grid-template-columns:1fr; }
    .routes { grid-template-columns:1fr; }
    h1 { font-size:25px; }
  }
</style>

let currentRoute = "TH-EG";

const cities = {
  "TH-EG": ["Bangkok", "Cairo"],
  "EG-TH": ["Cairo", "Bangkok"]
};

function setupRoute(route) {
  currentRoute = route;
  document.querySelectorAll(".route").forEach(b => b.classList.toggle("active", b.dataset.route === route));
  const [fromDefault,toDefault] = route === "TH-EG" ? ["Bangkok","Cairo"] : ["Cairo","Bangkok"];
  const from = document.getElementById("from"), to = document.getElementById("to");
  const opts = cities[route];
  from.innerHTML = `<option>${opts[0]}</option>`;
  to.innerHTML = `<option>${opts[1]}</option>`;
  from.value = fromDefault; to.value = toDefault;
  searchListings();
}

document.querySelectorAll(".route").forEach(b => b.addEventListener("click", () => setupRoute(b.dataset.route)));

function formatDate(d) {
  return new Date(d+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
}

const TIMEZONES = {
  "TH-EG": "Asia/Bangkok",   // ต้นทางไทย
  "EG-TH": "Africa/Cairo"    // ต้นทางอียิปต์
};

function getTodayStr(route) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: TIMEZONES[route],
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}
const DEV_MODE = new URLSearchParams(location.search).has("dev");

function parseBagPrice(v) {
  if (typeof v === "number") return v;
  if (typeof v !== "string") return null;
  // "6,xxx" -> 6000 (ประมาณการต่ำสุด), "5,600" -> 5600
  const n = parseInt(v.replace(/,/g, "").replace(/x/gi, "0"), 10);
  return Number.isNaN(n) ? null : n;
}

function searchListings() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const date = document.getElementById("date").value;
  const sort = document.getElementById("sort").value;

const today = getTodayStr(currentRoute);
  let data = listings.filter(x =>
  (DEV_MODE || !x.hidden) &&
  x.route === currentRoute &&
  x.from === from &&
  x.to === to &&
  x.date > today
);
if (date) data = data.filter(x => x.date.startsWith(date));  

    const byDate = (a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name);

  // เทียบตัวเลข โดยรายการที่ไม่มีราคาไปอยู่ท้าย
  const cmpNum = (x, y) => {
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return x - y;
  };

  if (sort === "date") {
    data.sort(byDate);
  } else if (sort === "priceKg") {
    data.sort((a, b) => cmpNum(a.pricePerKg, b.pricePerKg) || byDate(a, b));
  } else if (sort === "priceBag") {
    data.sort((a, b) =>
      cmpNum(parseBagPrice(a.pricePerBag), parseBagPrice(b.pricePerBag)) || byDate(a, b));
  }

  document.getElementById("summary").textContent =
    `พบ ${data.length} รายการ — ${from} → ${to}`;

  const results = document.getElementById("results");
  if (!data.length) {
    results.innerHTML = `<div class="empty">ยังไม่พบรายการที่ตรงกับการค้นหา<br><br>ลองเปลี่ยนวันที่ หรือเมือง</div>`;
    return;
  }

  results.innerHTML = data.map(x => `
  <article class="card">
    <div class="card-top">
      <div>
        <div class="title">👤 ${x.name}</div>
        <div class="meta">
        ✈️ ${x.from} → ${x.to}<br>
        📅 ${formatDate(x.date)}
      </div>
      </div>
    </div>
    <div class="price">
      ${x.pricePerKg != null ? `⚖️ ${x.pricePerKg.toLocaleString()} ${x.currency} / kg<br>` : ""}
      ${x.pricePerBag != null ? `🧳 ${typeof x.pricePerBag === "number" ? x.pricePerBag.toLocaleString() : x.pricePerBag} ${x.currency} / ใบ` : ""}    </div>
    <a class="contact" href="${x.contact}" target="_blank" rel="noopener noreferrer">ติดต่อผู้เดินทาง</a>
  </article>
`).join("");
}

function resetSearch() {
  document.getElementById("date").value = "";
  document.getElementById("sort").value = "date";
  setupRoute(currentRoute);
}
